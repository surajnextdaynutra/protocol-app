# cPanel (Apache) HTTPS: send the app domain to the Node app on port 3000.
# Goes in /etc/apache2/conf.d/userdata/ssl/2_4/<cpanel-user>/<domain>/proxy.conf
# then: /scripts/rebuildhttpdconf && /scripts/restartsrv_httpd
ProxyPreserveHost On
ProxyTimeout 300
RequestHeader set X-Forwarded-Proto "https"
# cPanel AutoSSL checks files here - keep them on Apache
ProxyPass /.well-known !
ProxyPass / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/
